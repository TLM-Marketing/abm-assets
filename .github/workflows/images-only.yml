name: images-only
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only media files allowed
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            case "$f" in
              README.md|.github/workflows/images-only.yml|.githooks/pre-commit|.gitignore) continue ;;
            esac
            case "${f,,}" in
              *.png|*.jpg|*.jpeg|*.webp|*.gif|*.svg|*.mp4|*.webm) ;;
              *) echo "not a media file: $f"; bad=1 ;;
            esac
            size=$(stat -c %s "$f")
            if [ "$size" -gt 15728640 ]; then echo "over 15 MB: $f"; bad=1; fi
            if ! file --mime-type -b "$f" | grep -Eq '^(image/|video/)'; then echo "content is not image/video: $f"; bad=1; fi
          done < <(git ls-files)
          exit $bad
